{% extends "home/base.html" %}

{% block title %}重設密碼 - VIVID{% endblock %}

{% block content %}
<div class="max-w-md mx-auto py-12">
    <div class="bg-white rounded-3xl border border-gray-100 p-10 shadow-2xl shadow-gray-200">
        <div class="text-center mb-10">
            <h2 class="text-3xl font-black text-gray-900 tracking-tight mb-2">設定新密碼</h2>
            <p class="text-sm text-gray-400 font-medium">請輸入您的新密碼。</p>
        </div>

        <form class="space-y-6" method="POST">
            <div class="space-y-2">
                <label class="text-xs font-black text-gray-400 uppercase tracking-widest ml-1">新密碼</label>
                <input type="password" name="new_password" required minlength="4"
                       class="w-full px-5 py-4 bg-gray-50 border-none rounded-2xl focus:ring-2 focus:ring-brand/20 transition-all outline-none text-gray-900 font-medium" 
                       placeholder="••••••••">
            </div>
            
            <div class="space-y-2">
                <label class="text-xs font-black text-gray-400 uppercase tracking-widest ml-1">確認新密碼</label>
                <input type="password" name="confirm_password" required minlength="4"
                       class="w-full px-5 py-4 bg-gray-50 border-none rounded-2xl focus:ring-2 focus:ring-brand/20 transition-all outline-none text-gray-900 font-medium" 
                       placeholder="••••••••">
            </div>
            
            <button type="submit" class="w-full py-4 bg-gray-900 text-white rounded-2xl font-bold text-lg hover:bg-brand transition-all duration-300 shadow-xl shadow-gray-200 hover:shadow-brand/20">
                更新密碼
            </button>
        </form>
    </div>
</div>
{% endblock %}
