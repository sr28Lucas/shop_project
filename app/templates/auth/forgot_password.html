{% extends "home/base.html" %}

{% block title %}忘記密碼 - VIVID{% endblock %}

{% block content %}
<div class="max-w-md mx-auto py-12">
    <div class="bg-white rounded-3xl border border-gray-100 p-10 shadow-2xl shadow-gray-200">
        <div class="text-center mb-10">
            <h2 class="text-3xl font-black text-gray-900 tracking-tight mb-2">忘記密碼</h2>
            <p class="text-sm text-gray-400 font-medium">請輸入您的註冊 Email，我們將發送重設連結給您。</p>
        </div>

        <form class="space-y-6" method="POST" action="{{ url_for('auth.forgot_password') }}">
            <div class="space-y-2">
                <label class="text-xs font-black text-gray-400 uppercase tracking-widest ml-1">Email</label>
                <input type="email" name="email" required 
                       class="w-full px-5 py-4 bg-gray-50 border-none rounded-2xl focus:ring-2 focus:ring-brand/20 transition-all outline-none text-gray-900 font-medium" 
                       placeholder="example@vivid.com">
            </div>
            
            <button type="submit" class="w-full py-4 bg-gray-900 text-white rounded-2xl font-bold text-lg hover:bg-brand transition-all duration-300 shadow-xl shadow-gray-200 hover:shadow-brand/20">
                發送重設信
            </button>
        </form>
        
        <div class="mt-10 pt-10 border-t border-gray-50 text-center">
            <a href="{{ url_for('auth.login') }}" class="inline-flex items-center text-sm font-black text-gray-900 hover:text-brand transition-colors uppercase tracking-widest">
                <i class="fa-solid fa-chevron-left mr-2"></i> 返回登入頁面
            </a>
        </div>
    </div>
</div>
{% endblock %}
