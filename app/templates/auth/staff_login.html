<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理員登入</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">
    <style>
        body { background-color: #f0f2f5; font-family: "Microsoft JhengHei", Arial, sans-serif; }
        .auth-container h2 { color: #34495e; }
        .auth-form button { background: #3498db; } /* 管理端使用藍色系 */
        .auth-form button:hover { background: #2980b9; }
    </style>
</head>
<body>
    <div class="auth-container">
        <h2>管理員登入</h2>
        
        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            {% for category, message in messages %}
              <div class="flash-message flash-error">{{ message }}</div>
            {% endfor %}
          {% endif %}
        {% endwith %}

        <form class="auth-form" method="POST" action="{{ url_for('auth.staff_login') }}">
            <div class="form-group">
                <label>帳號 (Email)</label>
                <input type="email" name="email" required placeholder="管理員帳號">
            </div>

            <div class="form-group">
                <label>密碼</label>
                <input type="password" name="password" required placeholder="管理員密碼">
            </div>

            <button type="submit">進入系統</button>
        </form>
    </div>
</body>
</html>
