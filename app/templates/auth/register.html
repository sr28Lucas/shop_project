{% extends "home/base.html" %}

{% block title %}會員申辦{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto py-12">
    <div class="bg-white rounded-3xl border border-gray-100 p-10 shadow-2xl shadow-gray-200">
        <div class="text-center mb-10">
            <h2 class="text-3xl font-black text-gray-900 tracking-tight mb-2">加入 VIVID</h2>
            <p class="text-sm text-gray-400 font-medium">開始您的現代極簡美學之旅</p>
        </div>

        <form class="space-y-8" method="POST" action="{{ url_for('auth.register') }}">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <!-- Primary Info -->
                <div class="md:col-span-2 space-y-2">
                    <label class="text-xs font-black text-gray-400 uppercase tracking-widest ml-1">Email <span class="text-brand">*</span></label>
                    <input type="email" name="email" maxlength="100" required 
                           class="w-full px-5 py-4 bg-gray-50 border-none rounded-2xl focus:ring-2 focus:ring-brand/20 transition-all outline-none text-gray-900 font-medium">
                </div>
                
                <div class="space-y-2">
                    <label class="text-xs font-black text-gray-400 uppercase tracking-widest ml-1">密碼 <span class="text-brand">*</span></label>
                    <input type="password" name="password" minlength="4" maxlength="30" required 
                           class="w-full px-5 py-4 bg-gray-50 border-none rounded-2xl focus:ring-2 focus:ring-brand/20 transition-all outline-none text-gray-900 font-medium">
                </div>

                <div class="space-y-2">
                    <label class="text-xs font-black text-gray-400 uppercase tracking-widest ml-1">確認密碼 <span class="text-brand">*</span></label>
                    <input type="password" name="confirm_password" minlength="4" maxlength="30" required 
                           class="w-full px-5 py-4 bg-gray-50 border-none rounded-2xl focus:ring-2 focus:ring-brand/20 transition-all outline-none text-gray-900 font-medium">
                </div>

                <!-- Personal Info -->
                <div class="space-y-2">
                    <label class="text-xs font-black text-gray-400 uppercase tracking-widest ml-1">姓名 <span class="text-brand">*</span></label>
                    <input type="text" name="name" maxlength="100" required 
                           class="w-full px-5 py-4 bg-gray-50 border-none rounded-2xl focus:ring-2 focus:ring-brand/20 transition-all outline-none text-gray-900 font-medium">
                </div>

                <div class="space-y-2">
                    <label class="text-xs font-black text-gray-400 uppercase tracking-widest ml-1">電話</label>
                    <input type="text" name="phone" maxlength="30" 
                           class="w-full px-5 py-4 bg-gray-50 border-none rounded-2xl focus:ring-2 focus:ring-brand/20 transition-all outline-none text-gray-900 font-medium">
                </div>

                <!-- Address -->
                <div class="space-y-2">
                    <label class="text-xs font-black text-gray-400 uppercase tracking-widest ml-1">縣市 (選填)</label>
                    <select name="region" 
                            class="w-full px-5 py-4 bg-gray-50 border-none rounded-2xl focus:ring-2 focus:ring-brand/20 transition-all outline-none text-gray-900 font-medium appearance-none">
                        <option value="">請選擇縣市</option>
                    </select>
                </div>

                <div class="space-y-2">
                    <label class="text-xs font-black text-gray-400 uppercase tracking-widest ml-1">鄉鎮市區 (選填)</label>
                    <select name="locality" 
                            class="w-full px-5 py-4 bg-gray-50 border-none rounded-2xl focus:ring-2 focus:ring-brand/20 transition-all outline-none text-gray-900 font-medium appearance-none">
                        <option value="">請選擇鄉鎮市區</option>
                    </select>
                </div>

                <div class="md:col-span-2 space-y-2">
                    <label class="text-xs font-black text-gray-400 uppercase tracking-widest ml-1">詳細地址 (選填，若輸入需至少 5 字)</label>
                    <input type="text" name="address" minlength="5" maxlength="200" 
                           class="w-full px-5 py-4 bg-gray-50 border-none rounded-2xl focus:ring-2 focus:ring-brand/20 transition-all outline-none text-gray-900 font-medium">
                </div>
            </div>
            
            <div class="pt-4">
                <button type="submit" class="w-full py-5 bg-gray-900 text-white rounded-2xl font-bold text-lg hover:bg-brand transition-all duration-300 shadow-xl shadow-gray-200 hover:shadow-brand/20">
                    確認申辦
                </button>
            </div>
        </form>
        
        <div class="mt-10 pt-10 border-t border-gray-50 text-center">
            <p class="text-sm text-gray-400 font-medium mb-4">已經有帳號了嗎？</p>
            <a href="{{ url_for('auth.login') }}" class="inline-flex items-center text-sm font-black text-gray-900 hover:text-brand transition-colors uppercase tracking-widest">
                返回登入頁面 <i class="fa-solid fa-arrow-right ml-2"></i>
            </a>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/home/checkout.js') }}"></script>
<script>
    initRegionSelect();
</script>
{% endblock %}
