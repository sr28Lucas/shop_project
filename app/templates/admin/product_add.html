<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>新增商品</title>
    <link rel="stylesheet" href="{{url_for('static', filename='css/admin/product_add.css')}}">
</head> 
 
<form method="POST" enctype="multipart/form-data">
    <label>新增商品</label>
    <div class="product">
        <div class="product-detail"> 
            <label>商品名稱</label>
            <input type="text" name="name" required>
        </div>
        <div class="product-detail">
            <label>售價</label>
            <input type="number" name="price">
        </div>
        <div class="product-detail">
            <label>庫存</label>
            <input type="number" name="stock">
        </div>
        <div class="product-detail">
            <label>商品描述</label>
            <input type="text" name="description">
        </div>
        <div>
            <select name="category_id">
                {% for category in categories %}
                <option value="{{ category.id }}" {{ 'selected' if product and product.category_id == category.id }}>
                    {{ category.name }}
                </option>
                {% endfor %}
            </select>
        </div>
    </div>




    <div id="image-management">
        <h3>產品圖片</h3>
        {% if product and product.images %}
            <div class="existing-images">
                {% for img in product.images %}
                <div class="img-item">
                    <img src="{{ url_for('static', filename='uploads/' + img.url) }}" width="100">
                    <input type="checkbox" name="delete_images" value="{{ img.id }}"> 刪除此圖
                </div>
                {% endfor %}
            </div>
        {% endif %}
        
        <label>上傳新圖片 (可多選):</label>
        <input type="file" name="images" multiple accept="image/*" id="img-input">
        <div id="preview-container"></div> </div>

    <button type="submit">儲存產品</button>
</form>

<script>
// JS 預覽邏輯：當選擇檔案時，僅在前端顯示，不觸發上傳
document.getElementById('img-input').addEventListener('change', function(e) {
    const container = document.getElementById('preview-container');
    container.innerHTML = ''; 
    Array.from(e.target.files).forEach(file => {
        const img = document.createElement('img');
        img.src = URL.createObjectURL(file);
        img.width = 100;
        container.appendChild(img);
    });
});
</script>
