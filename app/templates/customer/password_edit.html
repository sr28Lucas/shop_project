{% extends "home/base.html" %}

{% block title %}修改密碼 - 會員中心{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto py-10">
    <div class="flex items-center justify-between mb-8">
        <div>
            <nav class="flex text-xs text-gray-400 mb-2 space-x-2">
                <a href="{{ url_for('home.index') }}" class="hover:text-brand">首頁</a>
                <span>/</span>
                <a href="{{ url_for('customer.center') }}" class="hover:text-brand">會員中心</a>
                <span>/</span>
                <span class="text-gray-600 font-medium">修改帳號密碼</span>
            </nav>
            <h1 class="text-3xl font-black text-gray-900 tracking-tight">修改帳號密碼</h1>
        </div>
        <a href="{{ url_for('customer.center') }}" class="text-xs font-bold text-gray-400 hover:text-brand flex items-center bg-white px-4 py-2 rounded-xl border border-gray-100 transition-all shadow-sm">
            <i class="fa-solid fa-chevron-left mr-2"></i> 返回
        </a>
    </div>

    <form method="POST" class="space-y-8">
        <div class="bg-white rounded-3xl border border-gray-100 p-8 shadow-sm">
            <div class="flex items-center gap-4 mb-10">
                <div class="w-12 h-12 rounded-2xl bg-brand/5 flex items-center justify-center text-brand">
                    <i class="fa-solid fa-shield-halved text-xl"></i>
                </div>
                <div>
                    <h3 class="text-sm font-black text-gray-400 uppercase tracking-widest">安全性驗證</h3>
                    <p class="text-xs text-gray-400 mt-1">為了確保您的帳戶安全，請先驗證當前密碼。</p>
                </div>
            </div>
            
            <div class="space-y-6">
                <div class="space-y-2">
                    <label class="text-xs font-black text-gray-400 uppercase tracking-widest ml-1">請輸入原密碼</label>
                    <input type="password" name="old_password" required 
                           class="w-full px-5 py-4 bg-gray-50 border-none rounded-2xl focus:ring-2 focus:ring-brand/20 transition-all outline-none text-gray-900 font-medium" 
                           placeholder="••••••••">
                </div>
                
                <div class="pt-6 border-t border-gray-50 space-y-6">
                    <div class="space-y-2">
                        <label class="text-xs font-black text-gray-400 uppercase tracking-widest ml-1">新密碼</label>
                        <input type="password" name="new_password" required 
                               class="w-full px-5 py-4 bg-gray-50 border-none rounded-2xl focus:ring-2 focus:ring-brand/20 transition-all outline-none text-gray-900 font-medium" 
                               placeholder="至少 4 個字元">
                    </div>
                    <div class="space-y-2">
                        <label class="text-xs font-black text-gray-400 uppercase tracking-widest ml-1">確認新密碼</label>
                        <input type="password" name="confirm_password" required 
                               class="w-full px-5 py-4 bg-gray-50 border-none rounded-2xl focus:ring-2 focus:ring-brand/20 transition-all outline-none text-gray-900 font-medium" 
                               placeholder="再次輸入新密碼">
                    </div>
                </div>
            </div>
        </div>

        <div class="flex justify-end pt-4">
            <button type="submit" class="px-10 py-4 bg-gray-900 text-white rounded-2xl font-bold text-lg hover:bg-brand transition-all duration-300 shadow-xl shadow-gray-200 hover:shadow-brand/20">
                更新密碼
            </button>
        </div>
    </form>
</div>
{% endblock %}
