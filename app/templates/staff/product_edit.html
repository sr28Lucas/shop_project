<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>編輯商品 - 後臺系統</title>
    <link rel="stylesheet" href="{{url_for('static', filename='css/staff/common.css')}}">
    <link rel="stylesheet" href="{{url_for('static', filename='css/staff/product_add.css')}}">
    <style>
        .container { max-width: 1100px; width: 100%; margin: 0 auto; padding: 0 20px; box-sizing: border-box; }
        .form-control { max-width: 600px; width: 100%; box-sizing: border-box; }
    </style>
</head> 
<body>

<div class="container" style="width: 1100px; margin: 0 auto; max-width: 100%;">
    <div class="flex-between mb-20" style="width: 1100px;">
        <h1>編輯商品 <small style="color: #888; font-size: 0.6em;">ID: {{ product.id }}</small></h1>
        <a href="{{ url_for('staff.product.product_list') }}" class="btn btn-secondary">返回列表</a>
    </div>

    <form id="product-form" data-redirect-url="{{ url_for('staff.product.product_list') }}">
        <div class="card" style="width: 1100px;">
            <div class="card-header">基本資訊</div>
            <div class="form-group" style="width: 1060px;"> <!-- 1100px - padding -->
                <label>商品名稱 <span style="color: red;">*</span></label>
                <input type="text" name="name" value="{{ product.name }}" class="form-control" style="width: 1060px;" required>
            </div>
            <div class="form-group" style="width: 1060px;">
                <label>商品描述</label>
                <textarea name="description" class="form-control" rows="4" style="width: 1060px;"></textarea>
            </div>
            <div class="form-group" style="width: 1060px;">
                <label>商品分類 <span style="color: red;">*</span></label>
                <select name="category_id" class="form-control" style="width: 1060px;" required>
                    {% for category in categories %}
                    <option value="{{ category.id }}" {{ 'selected' if product.category_id == category.id }}>
                        {{ category.name }}
                    </option>
                    {% endfor %}
                </select>
            </div>
        </div>
        <!-- ... -->

        <div class="card">
            <div class="card-header">圖片管理</div>
            <div id="image-management">
                <p style="color: #666; font-size: 0.9em; margin-bottom: 10px;">提示：首張圖片將作為商品主圖。拖拽圖片可調整排序。</p>
                <input type="file" id="img-input" multiple accept="image/*" class="form-control">
                <div id="preview-container"></div>
            </div>
        </div>

        <div class="text-right">
            <button type="submit" class="btn btn-primary" style="padding: 12px 40px; font-size: 16px;">更新商品資訊</button>
        </div>
    </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
<script src="{{url_for('static', filename='js/staff/product_edit.js')}}"></script>
<script>
    // 初始化編輯器資料
    const initialImages = [
        {% for img in images %}
        { type: 'old', id: {{ img.id }}, url: "{{ url_for('static', filename='upload/' + img.filename) }}" },
        {% endfor %}
    ];
    initProductEdit(initialImages);
</script>
</body>
</html>
