<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>編輯個人資料 - 後臺系統</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/staff/common.css') }}">
</head>
<body>
    <h1>編輯個人資料</h1>
    <div class="action-bar" style="margin-bottom: 20px;">
        <a href="{{ url_for('staff.dashboard') }}" class="btn btn-secondary">← 返回儀表板</a>
    </div>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div style="padding: 10px; margin-bottom: 20px; border-radius: 5px; {% if category == 'error' %}background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb;{% else %}background: #d4edda; color: #155724; border: 1px solid #c3e6cb;{% endif %}">
            {{ message }}
          </div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <form method="POST" class="card" style="max-width: 600px;">
        <div class="form-group">
            <label>姓名</label>
            <input type="text" name="name" class="form-control" value="{{ staff.name }}" required>
        </div>
        <div class="form-group">
            <label>電話</label>
            <input type="text" name="phone" class="form-control" value="{{ staff.phone or '' }}">
        </div>
        <div class="form-group">
            <label>Email (無法修改)</label>
            <input type="text" class="form-control" value="{{ staff.email }}" readonly>
        </div>
        <button type="submit" class="btn btn-primary">儲存變更</button>
    </form>
</body>
</html>
