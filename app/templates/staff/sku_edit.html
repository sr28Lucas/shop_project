<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>修改 SKU - 後臺系統</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/staff/product_list.css') }}">
</head>
<body>
    <h1>修改 SKU</h1>
    <a href="{{ url_for('staff.product.sku_list', product_id=product_id) }}">返回 SKU 列表</a>

    <form action="{{ url_for('staff.product.sku_edit', product_id=product_id, sku_id=sku.id) }}" method="POST" enctype="multipart/form-data">
        <div>
            <label>貨號 (SKU Code):</label>
            <input type="text" name="sku_code" value="{{ sku.sku_code }}" required>
        </div>
        <div>
            <label>大小:</label>
            <input type="text" name="size" value="{{ sku.size }}">
        </div>
        <div>
            <label>顏色:</label>
            <input type="text" name="color" value="{{ sku.color }}">
        </div>
        <div>
            <label>價格:</label>
            <input type="number" step="0.01" name="price" value="{{ sku.price }}" required>
        </div>
        <div>
            <label>成本:</label>
            <input type="number" step="0.01" name="cost" value="{{ sku.cost }}" required>
        </div>
        <div>
            <label>庫存:</label>
            <input type="number" name="stock" value="{{ sku.stock }}" required>
        </div>
        <div>
            <label>狀態:</label>
            <select name="is_active">
                <option value="1" {{ 'selected' if sku.is_active }}>啟用</option>
                <option value="0" {{ 'selected' if not sku.is_active }}>停用</option>
            </select>
        </div>
        <div>
            <label>當前圖片:</label>
            <div style="display: flex; gap: 10px;">
                {% for img in images %}
                <img src="{{ url_for('image.route_image', filename=img.filename) }}" width="100">
                {% endfor %}
            </div>
        </div>
        <div>
            <label>新增圖片:</label>
            <input type="file" name="images" multiple>
        </div>
        <button type="submit" class="btn btn-edit">儲存修改</button>
    </form>
</body>
</html>
