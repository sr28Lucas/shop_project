<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>新增 SKU - 後臺系統</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/staff/product_list.css') }}">
</head>
<body>
    <h1>新增 SKU</h1>
    <a href="{{ url_for('staff.product.sku_list', product_id=product_id) }}">返回 SKU 列表</a>

    <form action="{{ url_for('staff.product.sku_add', product_id=product_id) }}" method="POST" enctype="multipart/form-data">
        <div>
            <label>貨號 (SKU Code):</label>
            <input type="text" name="sku_code" required>
        </div>
        <div>
            <label>大小:</label>
            <input type="text" name="size">
        </div>
        <div>
            <label>顏色:</label>
            <input type="text" name="color">
        </div>
        <div>
            <label>價格:</label>
            <input type="number" step="0.01" name="price" required>
        </div>
        <div>
            <label>成本:</label>
            <input type="number" step="0.01" name="cost" required>
        </div>
        <div>
            <label>庫存:</label>
            <input type="number" name="stock" value="0" required>
        </div>
        <div>
            <label>圖片:</label>
            <input type="file" name="images" multiple>
        </div>
        <button type="submit" class="btn btn-add">新增 SKU</button>
    </form>
</body>
</html>
