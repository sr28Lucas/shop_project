<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>修改密碼 - 後臺系統</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/staff/common.css') }}">
</head>
<body>
    <h1>修改密碼</h1>
    <div class="action-bar" style="margin-bottom: 20px;">
        <a href="{{ url_for('staff.dashboard') }}" class="btn btn-secondary">← 返回儀表板</a>
    </div>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div style="padding: 10px; margin-bottom: 20px; border-radius: 5px; {% if category == 'error' %}background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb;{% else %}background: #d4edda; color: #155724; border: 1px solid #c3e6cb;{% endif %}">
            {{ message }}
          </div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <form method="POST" class="card" style="max-width: 600px;">
        <div class="form-group">
            <label>舊密碼</label>
            <input type="password" name="old_password" class="form-control" required>
        </div>
        <div class="form-group">
            <label>新密碼</label>
            <input type="password" name="new_password" class="form-control" required>
        </div>
        <div class="form-group">
            <label>確認新密碼</label>
            <input type="password" name="confirm_password" class="form-control" required>
        </div>
        <button type="submit" class="btn btn-primary">修改密碼</button>
    </form>
</body>
</html>
